id: "nulab-backlog"
api_version: 2
version: "0.0.1"
display_name: "Nulab Backlog"
description: "Connect a Kandev workspace to a Nulab Backlog space."
author: "khuongdo"
categories: ["connector"]
repo_url: "https://github.com/khuongdo/kandev-plugin-nulab-backlog"

runtime:
  type: binary
  executables:
    linux-amd64: server/plugin-linux-amd64
    linux-arm64: server/plugin-linux-arm64
    darwin-amd64: server/plugin-darwin-amd64
    darwin-arm64: server/plugin-darwin-arm64
    windows-amd64: server/plugin-windows-amd64.exe

min_kandev_version: "0.96.0"

capabilities:
  state: true
  secrets: true

actions:
  - key: "connection.get"
    scope: "workspace"
    access: authenticated
    max_body_bytes: 8192
  - key: "connection.connect_api_key"
    scope: "workspace"
    access: admin
    max_body_bytes: 8192
  - key: "connection.set_enabled"
    scope: "workspace"
    access: admin
    max_body_bytes: 8192

ui:
  bundle: "/ui/bundle.js"
