name: release

# A vX.Y.Z tag on main publishes a GitHub Release with the package,
# checksums.txt and a build provenance attestation (US7.5, team Deployment).
# Creating the tag is the manual approval step.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          fetch-depth: 0

      - name: Read the pinned Kandev SDK commit
        id: sdk
        run: echo "ref=$(cat plugin/.kandev-sdk-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.sdk.outputs.ref }}
          path: kandev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: plugin/.nvmrc
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: plugin/ui
        run: npm ci

      - name: Check go mod tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Package verification runs before the preflight (project.md Mandated).
      - name: Run every check, package verification and the release preflight
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: make check-format vet lint test coverage check-secrets build package verify-package release-preflight TAG="$TAG"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: plugin/dist/
          if-no-files-found: error

  contract:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Read the pinned SDK commit and the minimum Kandev version
        id: versions
        run: |
          ref=$(cat plugin/.kandev-sdk-ref)
          min=$(sed -n 's/^min_kandev_version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' plugin/manifest.yaml)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.kandev-sdk-ref is not a full commit SHA"; exit 1; }
          [[ "$min" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::min_kandev_version is not X.Y.Z"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "min=$min" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev at the pinned SDK commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ steps.versions.outputs.ref }}
          path: kandev

      - name: Check out Kandev at the minimum version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: v${{ steps.versions.outputs.min }}
          path: kandev-min

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: |
            plugin/go.sum
            kandev-min/apps/backend/go.sum

      # Test the exact bytes verify uploaded and publish attests and ships,
      # never a rebuild (R-02).
      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: plugin/dist

      - name: Check the package checksum
        working-directory: plugin/dist
        run: sha256sum -c checksums.txt

      - name: Verify the downloaded package and run the packaged-host contract test
        working-directory: plugin
        run: make verify-package contract-test KANDEV_MIN_DIR=../kandev-min

  # The only job with any write permission.
  publish:
    needs: [verify, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist

      - name: Check the package checksum
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nulab-backlog-*.tar.gz

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
