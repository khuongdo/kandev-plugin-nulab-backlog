name: secrets

# Runs on every change, records and docs included, with no path filter, so
# the credential scan never depends on the ci.yml change classification (FR3).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      # cmd/ci never imports the Kandev SDK, so the scan needs no Kandev
      # checkout (NFR2); -o check-sdk skips only that prerequisite.
      - name: Scan for credential-shaped strings
        working-directory: plugin
        run: make -o check-sdk check-secrets
